[package]
name = "shirone-studio"
version = "0.1.2"
description = "Shirone Studio desktop editor"
authors = ["lkrkerry"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "shirone_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
reqwest = { version = "0.12", features = ["gzip", "brotli", "cookies"] }
