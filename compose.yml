# Shirone Studio plugin composition.
# Groups and plugin entries are expanded by packages/kernel.
# Plugin configs are validated by each plugin's Config schema.
groups:
  - id: core
    plugins:
      - name: '@shirone-studio/plugin-host'
      - name: '@shirone-studio/plugin-frontmatter'
      - name: '@shirone-studio/plugin-content-posts'
      - name: '@shirone-studio/plugin-content-series'
      - name: '@shirone-studio/plugin-content-moments'
      - name: '@shirone-studio/plugin-content-about'
      - name: '@shirone-studio/plugin-template-posts-algorithm'
      - name: '@shirone-studio/plugin-platforms'
      - name: '@shirone-studio/plugin-lint'
      - name: '@shirone-studio/plugin-preview'
      - name: '@shirone-studio/plugin-git'
