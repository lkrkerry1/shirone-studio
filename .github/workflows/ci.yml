name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm --filter @shirone-studio/desktop check
      - run: pnpm --filter @shirone-studio/desktop build

  rust:
    # WebView2 is preinstalled on Windows runners; Linux would need webkit2gtk.
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `generate_context!` embeds frontendDist, so ../dist must exist first.
      - run: pnpm --filter @shirone-studio/desktop build
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --lib
      - run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml
